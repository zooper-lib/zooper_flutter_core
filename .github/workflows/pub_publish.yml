# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Publish to pub.dev

"on":
  push:
    tags:
      - "v*"

concurrency:
  group: "publish-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Verify tag matches pubspec version
        shell: bash
        run: |
          set -euo pipefail

          tag_name="${GITHUB_REF_NAME}"
          pubspec_version_line="$(grep -E '^version:' pubspec.yaml || true)"
          if [[ -z "${pubspec_version_line}" ]]; then
            echo "Could not find a version in pubspec.yaml"
            exit 1
          fi

          pubspec_version="$(echo "${pubspec_version_line}" | awk '{print $2}')"
          pubspec_version_without_build_metadata="${pubspec_version%%+*}"
          expected_tag="v${pubspec_version_without_build_metadata}"

          if [[ "${tag_name}" != "${expected_tag}" ]]; then
            echo "Tag/version mismatch"
            echo "  tag:      ${tag_name}"
            echo "  expected: ${expected_tag} (from pubspec.yaml version: ${pubspec_version})"
            exit 1
          fi

      - name: Install dependencies
        run: dart pub get

      - name: Format (verify)
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Test
        run: dart test

      - name: Configure pub.dev credentials
        shell: bash
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          set -euo pipefail

          if [[ -z "${PUB_CREDENTIALS:-}" ]]; then
            echo "Missing secrets.PUB_CREDENTIALS"
            exit 1
          fi

          umask 077
          mkdir -p "${HOME}/.pub-cache"
          printf '%s' "${PUB_CREDENTIALS}" > "${HOME}/.pub-cache/credentials.json"

      - name: Publish (dry run)
        run: dart pub publish --dry-run

      - name: Publish
        run: dart pub publish --force
